name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! The diagnostics file below contains everything we need (versions, sensor states, device config) — please attach it so we don't have to guess.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you expect vs. what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      value: |
        1.
        2.
        3.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      description: |
        **Required.** Go to Settings → Devices & Services → AURUM → ⋮ → Download diagnostics, then drag-and-drop the JSON file into this field. Contains AURUM version, HA version, sensor states, battery state and device configuration.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: |
        If the bug shows up in logs: Settings → System → Logs → filter for "aurum" → paste here.
      render: shell

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true
