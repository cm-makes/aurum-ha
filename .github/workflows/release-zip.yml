name: Release ZIP

# Attaches aurum.zip to every published release. hacs.json sets zip_release,
# so the Marketplace installs this asset and shows its download count.
# Re-run by hand (Run workflow, enter the tag) if the upload failed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.16.2"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  zip:
    name: Build and attach aurum.zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build aurum.zip
        run: python tools/build_release_zip.py --tag "$TAG" --out aurum.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" aurum.zip --clobber --repo "$GITHUB_REPOSITORY"
