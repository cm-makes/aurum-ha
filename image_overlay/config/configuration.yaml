# ══════════════════════════════════════════════════════════════
#  AURUM Plug & Play – Home Assistant configuration
# ══════════════════════════════════════════════════════════════
#  This file is intended for fresh HA installations bootstrapped via
#  `tools/quickstart.sh`. Safe to merge manually with an existing
#  configuration.yaml: just copy the `frontend:` and `homeassistant:`
#  (themes:) blocks if you already have other content.
#
#  The AURUM dashboard is provided by the integration itself as a built-in
#  sidebar panel — no lovelace dashboard needs to be configured here.
#
#  Reference: https://www.home-assistant.io/docs/configuration/
# ══════════════════════════════════════════════════════════════

# Core HA features: history, recorder, logbook, frontend, etc.
default_config:

homeassistant:
  # Make the `themes` folder readable
  customize: !include_dir_merge_named customize/
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

# The AURUM sidebar dashboard is registered automatically by the integration
# (a built-in custom panel) — no `lovelace:` dashboard entry is required.

# ── Optional: sensible logging defaults ──
logger:
  default: info
  logs:
    custom_components.aurum: info
